<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="부릉플러스 기사앱을 직접 눌러보며 익히는 연습 모음입니다." />
    <title>부릉플러스 연습하기</title>
    <style>
      :root {
        --blue: #1b64da;
        --ink: rgba(0, 0, 0, 0.87);
        --ink-2: rgba(0, 0, 0, 0.6);
        --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', 'Malgun Gothic', sans-serif;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

      html, body { margin: 0; padding: 0; }

      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(160deg, #2f6fe0 0%, #1b64da 55%, #174fad 100%);
        color: #fff;
        font-family: var(--font);
        /* 한글은 어절 단위로 끊어야 어색하게 잘리지 않습니다. */
        word-break: keep-all;
      }

      .wrap { width: 100%; max-width: 420px; }

      .tag {
        display: inline-block;
        padding: 6px 14px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 27px;
        line-height: 1.35;
        letter-spacing: -0.4px;
      }

      .sub { margin: 0 0 28px; font-size: 14.5px; color: rgba(255, 255, 255, 0.78); }

      /* 연습이 늘어나면 이 목록에 <a class="item">을 한 줄 더 넣으면 됩니다. */
      .item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        padding: 18px 18px;
        border-radius: 14px;
        background: #fff;
        color: var(--blue);
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(12, 24, 48, 0.16);
      }

      .item__t { flex: 1; font-size: 16px; font-weight: 700; }

      .item__s {
        display: block;
        margin-top: 3px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-2);
      }

      .item__go { flex: none; font-size: 20px; color: #9bb6e4; }

      .foot {
        margin: 22px 0 0;
        text-align: center;
        font-size: 12.5px;
        color: rgba(255, 255, 255, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="tag">부릉플러스 기사앱</span>
      <h1>무엇을<br />연습해볼까요?</h1>
      <p class="sub">쓰는 사람 폰에 맞는 걸 골라주세요.</p>

      <a class="item" href="postpaid/">
        <span class="item__t">후불결제 · 안드로이드
          <span class="item__s">현금 · 카드(KIS Pay·이지체크) · 분할 · 현금영수증</span>
        </span>
        <span class="item__go">›</span>
      </a>

      <a class="item" href="postpaid/ios/">
        <span class="item__t">후불결제 · 아이폰
          <span class="item__s">현금 · 카드(이지체크) · QR 간편 · 분할</span>
        </span>
        <span class="item__go">›</span>
      </a>

      <p class="foot">연습용 화면이라 실제 결제는 일어나지 않아요</p>
    </div>
  </body>
</html>
