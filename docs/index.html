<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>후불결제 연습하기</title>
    <meta name="description" content="부릉플러스 기사앱 후불결제를 손으로 따라 해보는 연습 화면입니다. 쓰시는 폰에 맞춰 열려요." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <style>
      :root {
        --blue: #1b64da;
        --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', 'Malgun Gothic', sans-serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        background: linear-gradient(180deg, #2f7ce8 0%, #1b64da 55%, #1550b4 100%);
        color: #fff;
        font-family: var(--font);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(28px + env(safe-area-inset-top, 0px)) 22px
          calc(28px + env(safe-area-inset-bottom, 0px));
      }
      .box { width: 100%; max-width: 340px; text-align: center; }
      .tag {
        display: inline-block;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      h1 {
        margin: 18px 0 6px;
        font-size: 27px;
        line-height: 1.32;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .sub { margin: 0 0 26px; font-size: 14px; color: rgba(255, 255, 255, 0.78); }
      a.opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        min-height: 56px;
        margin-bottom: 10px;
        padding: 0 18px;
        border-radius: 12px;
        background: #fff;
        color: var(--blue);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-decoration: none;
      }
      a.opt i { font-style: normal; color: #9db9e8; font-weight: 700; }
      .foot { margin: 16px 0 0; font-size: 11.5px; color: rgba(255, 255, 255, 0.7); }
      /* 폰을 알아보면 곧장 넘기므로, 그때는 이 고르는 화면을 숨깁니다. */
      .go .box { visibility: hidden; }
    </style>
  </head>
  <body>
    <div class="box">
      <span class="tag">부릉플러스 기사앱</span>
      <h1>후불결제<br />연습하기</h1>
      <p class="sub">쓰시는 폰을 골라주세요</p>
      <a class="opt" href="postpaid-android/">안드로이드 폰 <i>›</i></a>
      <a class="opt" href="postpaid-ios/">아이폰 <i>›</i></a>
      <p class="foot">연습용 화면이라 실제 결제는 일어나지 않아요</p>
    </div>

    <script>
      /* 기사님은 링크 하나만 받습니다. 폰을 알아보면 곧장 그 갈래로 넘기고,
       * 못 알아보면 위 두 버튼을 그대로 보여줍니다.
       * 잘못 넘어갔을 때를 위해 ?pick 을 붙이면 넘기지 않고 고르게 둡니다. */
      ;(function () {
        if (location.search.indexOf('pick') > -1) return

        var ua = navigator.userAgent || ''
        var ios =
          /iPhone|iPad|iPod/.test(ua) ||
          /* iPadOS 13+ 는 맥인 척합니다 — 터치가 되면 아이패드로 봅니다 */
          (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)
        var android = /Android/.test(ua)

        if (!ios && !android) return
        document.documentElement.className = 'go'
        location.replace(ios ? 'postpaid-ios/' : 'postpaid-android/')
      })()
    </script>
  </body>
</html>
