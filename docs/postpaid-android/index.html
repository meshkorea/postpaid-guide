<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="부릉플러스 기사앱 후불결제를 손으로 따라 해보는 연습 화면입니다. 현금·카드(KIS Pay·이지체크)·분할 결제와 현금영수증 발급을 단계별로 익힐 수 있어요." />
    <title>후불결제 연습하기</title>
    <style>
      /* 후불결제 연습하기 — 페이지 껍데기, 폰 프레임, 안내 배너, 탭 위치 강조 */

:root {
  --blue: #1b64da;
  --blue-weak: #eef4fe;
  --blue-dark: #174fad;
  --ink: rgba(0, 0, 0, 0.87);
  --ink-2: rgba(0, 0, 0, 0.6);
  --ink-3: rgba(0, 0, 0, 0.4);
  --line: #e9eaee;
  --bg: #f4f5f7;
  --orange: #eb5a1e;
  --teal: #0e9694;
  --magenta: #d33cb8;
  --green: #13bf80;

  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR',
    'Malgun Gothic', sans-serif;

  /* 폰 프레임 기준 크기 — 안드로이드 360dp */
  --screen-w: 360px;
  --screen-h: 780px;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #eceef2;
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  /* 한글은 어절 단위로 끊어야 «(역 / 삼동)»처럼 어색하게 잘리지 않습니다. */
  word-break: keep-all;
}

button {
  font-family: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

/* ───────────────────────── 무대 ───────────────────────── */

.stage {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 16px;
}


.frame {
  position: relative;
  /* 테두리는 화면 밖에 둡니다 — 안쪽이 디자인 기준 360×780이어야 합니다. */
  box-sizing: content-box;
  width: var(--screen-w);
  height: var(--screen-h);
  background: #fff;
  border-radius: 30px;
  border: 8px solid #16181d;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 18px 50px rgba(20, 24, 35, 0.28);
  transform: scale(var(--scale, 1));
  transform-origin: top center;
  flex: none;
}

/* 프레임을 축소해도 아래 컨트롤이 겹치지 않도록 실제 차지하는 높이를 맞춰 둡니다. */
.frame-slot {
  width: calc((var(--screen-w) + 16px) * var(--scale, 1));
  height: calc((var(--screen-h) + 16px) * var(--scale, 1));
  flex: none;
}

/* 진짜 폰에서 볼 때는 테두리가 자리만 차지합니다. 쿠팡이츠·배민 «연습하기»도
 * PC에서는 폰 모양으로, 폰에서는 화면을 꽉 채웁니다. 기사님은 폰으로 보십니다. */
@media (max-width: 520px) {
  .stage {
    padding: 0;
    gap: 0;
  }

  .frame-slot {
    width: 100%;
    height: 100dvh;
  }

  /* 기사님이 폰으로 보기 때문에 글씨가 작습니다. 화면 좌표계를 --zoom배 줄이고
   * 같은 배율로 다시 키우면 글씨·아이콘·여백이 한꺼번에 커지면서도
   * 화면은 정확히 꽉 찹니다. 크기를 조절하려면 --zoom 하나만 바꾸면 됩니다. */
  .frame {
    --zoom: 1;
    box-sizing: border-box;
    width: calc(100vw / var(--zoom));
    height: calc(100dvh / var(--zoom));
    border: 0;
    border-radius: 0;
    box-shadow: none;
    transform: scale(var(--zoom));
    transform-origin: top left;
    /* 홈 인디케이터에 버튼이 가리지 않게 합니다 (viewport-fit=cover).
     * 좌표계가 --zoom배 줄어 있으므로 여백도 같은 배로 나눕니다. */
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) / var(--zoom));
  }
}

/* 화면이 높을수록 더 키웁니다. 낮은 폰에서 무리하게 키우면 바텀시트 아래가 잘려요. */
@media (max-width: 520px) and (min-height: 700px) {
  .frame { --zoom: 1.06; }
}

@media (max-width: 520px) and (min-height: 760px) {
  .frame { --zoom: 1.12; }
}

/* ───────────────────────── 안내 배너 ─────────────────────────
 * 흰 바탕에 회색 상황 한 줄 + 굵은 지시 한 줄(눌러야 할 것은 파랑),
 * 오른쪽 위에 진행 수, 맨 위에 진행 막대. */

.band {
  position: relative;
  z-index: 40;
  flex: none;
  background: #fff;
  padding: 16px 18px 15px;
  border-bottom: 1px solid #e9eaee;
}

.band__bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: #e9eaee;
}

.band__bar i {
  display: block;
  height: 100%;
  background: var(--blue);
  border-radius: 0 2px 2px 0;
  transition: width 0.3s ease-out;
}

.band__q {
  font-size: 14px;
  line-height: 20px;
  color: rgba(0, 0, 0, 0.5);
  margin: 0 0 3px;
  padding-right: 48px;
}

.band__count {
  position: absolute;
  top: 16px;
  right: 18px;
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(0, 0, 0, 0.35);
  font-variant-numeric: tabular-nums;
}

.band__a {
  font-size: 19px;
  line-height: 27px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
  color: var(--ink);
}

.band__a b {
  color: var(--blue);
  font-weight: 800;
}

.band__note {
  margin: 7px 0 0;
  font-size: 12.5px;
  line-height: 18px;
  color: rgba(0, 0, 0, 0.45);
  padding-left: 16px;
  position: relative;
}

.band__note::before {
  content: '!';
  position: absolute;
  left: 0;
  top: 2px;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #ffb92e;
  color: #fff;
  font-size: 9.5px;
  font-weight: 800;
  line-height: 13px;
  text-align: center;
}

.band.is-nudge {
  animation: nudge 0.4s;
}

@keyframes nudge {
  25% {
    transform: translateX(-5px);
  }
  50% {
    transform: translateX(5px);
  }
  75% {
    transform: translateX(-3px);
  }
}

/* ───────────────────────── 화면 영역 ───────────────────────── */

.viewport {
  position: relative;
  flex: 1;
  min-height: 0;
  /* 화면이 낮은 폰에서는 시트 아래가 잘립니다. 잘린 채 두지 않고 밀어서 볼 수 있게 합니다.
   * 눌러야 할 곳은 placeSpot()이 알아서 보이는 자리로 끌어옵니다. */
  overflow-x: hidden;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  background: var(--bg);
}

/* 스크롤 막대는 연습 화면을 어지럽히므로 숨깁니다. */
.viewport::-webkit-scrollbar { width: 0; height: 0; }

/* ── 앱이 바뀔 때 ────────────────────────────────────────
 * 부릉플러스 → KIS Pay → 이지체크로 넘어가는 순간, 폰에서 다른 앱이 뜨듯
 * 화면이 살짝 작은 데서 커지며 올라옵니다. 바뀐 줄 모르고 헤매지 않게요.
 * 뒤에 깔린 앞 화면은 잠깐 뒤로 물러나 보입니다. */
.viewport.is-switching {
  background: #0c121e;
}

.viewport.is-switching > :first-child {
  animation: app-open 0.42s cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

@keyframes app-open {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(22px);
    border-radius: 22px;
  }
  60% {
    opacity: 1;
  }
  to {
    opacity: 1;
    transform: none;
    border-radius: 0;
  }
}

/* ─────────── 눌러야 할 곳만 남기고 화면을 덮습니다 ─────────── */

.spot {
  position: absolute;
  z-index: 30;
  border-radius: 12px;
  pointer-events: none;
  box-shadow:
    0 0 0 3px var(--blue),
    0 0 0 9999px rgba(12, 18, 30, 0.55);
}

/* ── 고객이 건네며 말하는 장면 ───────────────────────────
 * 강조 링(z-index 30)이 만드는 어둠 위에 떠야 밝게 보이므로 그보다 위에 둡니다.
 * 앱 화면도 함께 보여야 하므로 크게 키우지 않고, 아래 결제 버튼을 가리지
 * 않도록 위쪽에 둡니다. pointer-events는 꺼서 탭을 막지 않습니다. */
.scene {
  position: absolute;
  left: 0;
  right: 0;
  top: 40%;
  transform: translateY(-50%);
  z-index: 33;
  display: flex;
  justify-content: center;
  pointer-events: none;
  /* 어둠이 깔릴 때까지 숨어 있다가(placeSpot이 is-in을 붙입니다) 떠오릅니다. */
  opacity: 0;
}

.scene.is-in {
  animation: scene-in 0.42s cubic-bezier(0.2, 0.75, 0.25, 1) 0.12s both;
}

/* 그림과 말풍선을 한 덩어리로 세로로 쌓습니다. 말풍선을 흐름에 두면
 * 글자가 길어 두 줄이 돼도 사람과의 간격이 그대로 유지됩니다. */
.scene__in {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 290px;
}

.scene__fig {
  display: block;
  width: 277px;
  height: auto;
  margin: 0;
  filter: drop-shadow(0 8px 16px rgba(8, 16, 34, 0.45));
}

/* 말풍선은 머리 오른쪽 위에 띄우고 꼬리로 사람을 가리킵니다.
 * 몸 위에 겹치면 그림이 지저분해집니다. */
.scene__say {
  position: relative;
  /* 꼬리 7px + 원 위까지 4px (그림 위 여백 1칸은 빼고) */
  margin: 0 0 10px;
  max-width: 180px;
  background: #fff;
  color: var(--ink);
  /* 꼬리를 아래 가운데에 따로 두므로 네 모서리를 고르게 둥글립니다.
   * 한 모서리만 각지면 꼬리가 둘처럼 보입니다. */
  border-radius: 15px;
  padding: 9px 13px;
  font-size: 14.5px;
  font-weight: 700;
  line-height: 1.38;
  box-shadow: 0 6px 16px rgba(8, 16, 34, 0.34);
}

/* 사람이 그림 한가운데 있으므로 꼬리도 가운데에서 내려옵니다. */
.scene__say::after {
  content: '';
  position: absolute;
  left: 50%;
  margin-left: -7px;
  bottom: -7px;
  border: 7px solid transparent;
  border-bottom: 0;
  border-top-color: #fff;
}

/* .scene이 평소 숨어 있으므로(opacity 0) 끝 상태를 반드시 적어야 합니다.
 * 안 적으면 원래 값인 «보이지 않음»으로 되돌아갑니다. */
@keyframes scene-in {
  from {
    opacity: 0;
    transform: translateY(calc(-50% + 10px));
  }
  to {
    opacity: 1;
    transform: translateY(-50%);
  }
}

/* 말풍선 안내 — 누르지 않고 «다음»으로 넘어가는 설명 단계 */
.tip {
  position: absolute;
  z-index: 32;
  background: #fff;
  border-radius: 12px;
  padding: 13px 14px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.tip__body {
  flex: 1;
  min-width: 0;
}

.tip__title {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}

/* 기사님이 폰으로 읽는 글이라 안내 띠(13px)보다 작으면 안 됩니다. */
.tip__desc {
  font-size: 13.5px;
  line-height: 1.5;
  color: rgba(0, 0, 0, 0.72);
  margin: 0;
  /* «신용결제·삼성페이·카메라결제·…»처럼 가운뎃점으로만 이어진 긴 낱말은
   * keep-all 때문에 줄이 안 바뀌어, 글꼴이 조금만 넓어도 밖으로 삐져나옵니다.
   * 이럴 때만 낱말 안에서도 끊게 합니다. */
  overflow-wrap: anywhere;
}

.tip__next {
  flex: none;
  align-self: center;
  height: 32px;
  padding: 0 14px;
  border-radius: 8px;
  background: #eceef2;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

/* 가리키는 삼각형 */
.tip__arrow {
  position: absolute;
  width: 16px;
  height: 9px;
  background: #fff;
  clip-path: polygon(50% 100%, 0 0, 100% 0);
}

.tip--below .tip__arrow {
  clip-path: polygon(50% 0, 0 100%, 100% 100%);
  top: -9px;
}

.tip--above .tip__arrow {
  bottom: -9px;
}

/* 누를 자리를 가리키는 손 */
.hand {
  position: absolute;
  z-index: 31;
  width: 46px;
  height: 46px;
  pointer-events: none;
  filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45));
  animation: hand-tap 1.6s ease-in-out infinite;
}

@keyframes hand-tap {
  0%,
  100% {
    transform: translate(0, 0);
  }
  45% {
    transform: translate(-3px, -7px);
  }
}

/* ─────────────── 프레임 안 맨 위 컨트롤 ───────────────
 * 기사님이 폰으로 보기 때문에 프레임 밖에 두면 엄지가 닿지 않습니다. */

.topbar {
  flex: none;
  height: 44px;
  background: #fff;
  border-bottom: 1px solid #e9eaee;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}

.topbar__btn {
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  padding: 6px 0;
}

/* ───────────────────────── 표지 ─────────────────────────
 * 쿠팡이츠 «첫 배달 체험», 배민 «연습하기» 표지와 같은 자리입니다. */

.cover {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, #2f7ce8 0%, #1b64da 55%, #1550b4 100%);
  padding: 30px 22px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-y: auto;
}

.cover__tag {
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  padding: 6px 14px;
}

.cover__hi {
  color: rgba(255, 255, 255, 0.85);
  font-size: 14px;
  font-weight: 600;
  margin: 16px 0 6px;
}

.cover__title {
  color: #fff;
  text-align: center;
  font-size: 27px;
  line-height: 1.32;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0;
}

.cover__art {
  width: 240px;
  height: 186px;
  /* 위아래 남는 자리를 나눠 가져 그림이 가운데에 오게 합니다. */
  margin: auto 0;
  flex: none;
}

/* 그림자 위에 둥둥 — 카드가 뜨는 만큼 그림자는 작아지고 옅어집니다. */
.cover__float {
  animation: float 3.4s ease-in-out infinite;
}

@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-9px);
  }
}

.cover__shadow {
  transform-box: fill-box;
  transform-origin: center;
  animation: float-shadow 3.4s ease-in-out infinite;
}

@keyframes float-shadow {
  0%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(0.84);
    opacity: 0.66;
  }
}

@media (prefers-reduced-motion: reduce) {
  .cover__float,
  .cover__shadow {
    animation: none;
  }
}

.cover__opts {
  width: 100%;
  margin-top: auto;
}

.cover__opt {
  width: 100%;
  height: 52px;
  border-radius: 12px;
  background: #fff;
  color: var(--blue);
  font-size: 15.5px;
  font-weight: 800;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  margin-bottom: 10px;
  box-shadow: 0 3px 10px rgba(6, 30, 70, 0.18);
}

.cover__opt .track__go,
.cover__opt svg {
  color: #9db9e8;
  flex: none;
}

.cover__opt.is-done {
  background: rgba(255, 255, 255, 0.86);
}

.cover__check {
  font-style: normal;
  color: #009159;
  font-weight: 800;
}

.cover__foot {
  color: rgba(255, 255, 255, 0.7);
  font-size: 11.5px;
  margin: 6px 0 0;
  text-align: center;
}

/* 링크를 하나만 받은 기사님이 기종을 잘못 열었을 때 건너가는 줄 */
.cover__switch {
  margin: 10px 0 2px;
  padding: 7px 14px;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 999px;
  color: rgba(255, 255, 255, 0.92);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.02em;
  text-decoration: none;
  flex: none;
}

/* ───────────────────────── 시작 모달 ─────────────────────────
 * 목록 화면을 따로 두지 않고, 앱 화면 위에 모달로 시작합니다. */

.start {
  position: absolute;
  z-index: 20;
  left: 20px;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
  background: #fff;
  border-radius: 20px;
  padding: 26px 20px 20px;
  text-align: center;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.28);
  max-height: calc(100% - 32px);
  overflow-y: auto;
}

.start__icon {
  width: 60px;
  height: 60px;
  margin: 0 auto 14px;
  display: block;
}

.start__title {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 8px;
}

.start__desc {
  font-size: 14px;
  line-height: 21px;
  color: var(--ink-2);
  margin: 0 0 20px;
}

.start__notice {
  background: #fff6e5;
  color: #8a5a00;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  line-height: 19px;
  margin: 0 0 16px;
}

.start__notice b {
  color: #7a4a00;
  font-weight: 800;
}

.start__go {
  width: 100%;
  height: 52px;
  border-radius: 12px;
  background: var(--blue);
  color: #fff;
  font-size: 16px;
  font-weight: 800;
}

/* 연습 끝 */

/* 마무리는 «앱 화면»이 아니라 «연습 가이드»의 화면입니다. 표지와 같은 파란 바탕을
 * 써서, 파란 화면이면 가이드고 흰 화면이면 실제 앱이라는 규칙을 만듭니다. */
/* 화면을 덮지 않고 띠 아래에 놓습니다. 덮어버리면 위쪽 «처음으로»가 가려집니다. */
.outro {
  position: relative;
  flex: 1;
  min-height: 0;
  background: linear-gradient(180deg, #2f7ce8 0%, #1b64da 55%, #1550b4 100%);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow-y: auto;
}

/* 결과는 카드 하나로 묶습니다 — 흰 덩어리가 둘이면 시선이 흩어집니다. */
.outro__card {
  background: #fff;
  border-radius: 20px;
  padding: 22px 16px 16px;
  box-shadow: 0 14px 34px rgba(8, 28, 68, 0.22);
}

.outro__check {
  width: 48px;
  height: 48px;
  display: block;
  margin: 0 auto 12px;
}

.outro__title {
  text-align: center;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.38;
  margin: 0 0 6px;
  color: var(--ink);
}

.outro__sub {
  text-align: center;
  font-size: 13.5px;
  color: var(--ink-3);
  margin: 0 0 18px;
}

.recap {
  background: var(--bg);
  border-radius: 12px;
  padding: 14px 15px;
}

.recap__h {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
  margin: 0 0 8px;
  letter-spacing: 0.02em;
}

.recap__li {
  position: relative;
  padding-left: 13px;
  font-size: 13.5px;
  line-height: 1.5;
  margin: 0 0 7px;
  color: var(--ink);
  /* 두 줄이 되는 줄은 «있어요»만 혼자 떨어지지 않게 고르게 나눕니다. */
  text-wrap: balance;
}

.recap__li:last-child {
  margin-bottom: 0;
}

/* «카메라·간편결제·NFC»처럼 가운뎃점으로 묶은 말은 통째로 넘깁니다.
 * 안 그러면 다음 줄이 «·간편결제»로 시작해 읽다 걸립니다. */
.recap__li b {
  white-space: nowrap;
}

.recap__li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--blue);
}

/* ── 마무리 카드 아래 앱 설치 버튼 ─────────────────────────
 * 연습만 하고 정작 앱이 없으면 현장에서 막히므로 여기서 바로 받게 합니다. */
.stores {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.stores__h {
  margin: 0 0 9px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-3);
}

.store {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 42px;
  margin-bottom: 7px;
  border: 1px solid #cdd9ee;
  border-radius: 10px;
  color: var(--blue);
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
}

.store:last-child {
  margin-bottom: 0;
}

.store:active {
  background: var(--blue-weak);
}

.outro__btn {
  flex: none;
  margin-top: 14px;
  height: 50px;
  border-radius: 14px;
  background: #fff;
  color: var(--blue);
  font-size: 16px;
  font-weight: 700;
  width: 100%;
  box-shadow: 0 6px 16px rgba(8, 28, 68, 0.18);
}

/* 아래쪽 글자 버튼 둘을 한 줄에 놓습니다. */
.outro__links {
  flex: none;
  display: flex;
  gap: 8px;
  margin-top: 2px;
}

.outro__links .outro__link {
  flex: 1;
  margin-top: 0;
}

.outro__link {
  flex: none;
  height: 42px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 14px;
  font-weight: 600;
  width: 100%;
  margin-top: 2px;
}

/* 연습에 나오는 화면들 — 부릉플러스 기사앱, KIS Pay 앱, 이지체크(KICC) 앱 */

.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

/* 안드로이드 상태바 — 지도 위에 겹쳐 놓습니다 */
.statusbar {
  position: relative;
  z-index: 1;
  flex: none;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink);
  background: transparent;
}

.statusbar--dark {
  color: #fff;
}

.statusbar__icons {
  display: flex;
  gap: 4px;
  align-items: center;
  font-size: 10px;
  letter-spacing: 1px;
}

/* 안드로이드 내비게이션 바 */
.navbar {
  flex: none;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  color: var(--ink-3);
  font-size: 15px;
}

.navbar--dark {
  background: #000;
  color: rgba(255, 255, 255, 0.75);
}

/* ═══════════════ 부릉플러스 · 배달지 상세 ═══════════════ */

.map {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  background: #eef0e9;
}

/* 배달지 상세 — Figma 882:82730 기준.
 * 바텀시트가 위까지 올라와 있어 지도는 상태바 높이(28px)만 보입니다. */
.detail {
  position: absolute;
  top: 28px;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  background: #eceef2;
  border-radius: 16px 16px 0 0;
  overflow: hidden;
}

/* 핸들은 시트 맨 위 흰 영역에 얹힙니다 — 카드 사이 회색 띠와 섞이면 안 됩니다. */
.detail__grip {
  flex: none;
  background: #fff;
  padding-top: 8px;
}

.detail__handle {
  display: block;
  width: 48px;
  height: 5px;
  border-radius: 2.5px;
  background: #d9dce1;
  margin: 0 auto;
}

.detail__scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 0 8px;
}

/* 카드 사이 8px 회색 띠 */
.card {
  background: #fff;
  padding: 16px 16px;
}

.card:first-child {
  padding-top: 13px;
}

.card + .card {
  margin-top: 8px;
}

.eyebrow {
  color: var(--orange);
  font-size: 13px;
  line-height: 20px;
  font-weight: 700;
  margin: 0 0 8px;
}

.addr {
  font-size: 18px;
  line-height: 25px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}

.addr-sub {
  font-size: 15px;
  line-height: 22px;
  margin: 0;
  color: var(--ink);
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

.addr-sub > span {
  flex: 1;
}

.addr-sub > .copy {
  flex: none;
  font-size: 12px;
  line-height: 18px;
  color: var(--ink-2);
  text-decoration: underline;
  padding-top: 2px;
}

.btn-row {
  display: flex;
  gap: 8px;
  margin: 16px 0 0;
}

.btn-line {
  flex: 1;
  height: 48px;
  border: 1px solid #d8dbe2;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #fff;
}

.btn-line--sm {
  flex: none;
  height: 36px;
  padding: 0 12px;
  font-size: 14px;
  border-radius: 6px;
  margin-top: 16px;
}

.label {
  font-size: 12px;
  line-height: 18px;
  color: var(--ink-3);
  margin: 0;
}

.value {
  font-size: 16px;
  line-height: 24px;
  font-weight: 700;
  margin: 4px 0 0;
  letter-spacing: -0.01em;
}

.value--lg {
  font-size: 17px;
  line-height: 25px;
}

.value--plain {
  font-weight: 500;
  font-size: 15px;
  line-height: 22px;
  margin: 4px 0 0;
}

.amount-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg);
  border-radius: 8px;
  height: 46px;
  padding: 0 12px;
  margin: 16px 0 0;
}

.amount-row__label {
  font-size: 14px;
  color: var(--ink-2);
}

.amount-row__value {
  font-size: 16px;
  font-weight: 700;
  margin-right: auto;
}

.badge {
  flex: none;
  height: 20px;
  padding: 0 8px;
  border-radius: 4px;
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
}

.badge--cash {
  background: var(--teal);
}

.badge--card {
  background: var(--magenta);
}

/* 잔여 금액 안내 — 결제 바 위, 가운데 (Figma 882:82620) */
.warn-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  color: #f5822a;
  font-size: 13px;
  line-height: 20px;
  font-weight: 700;
  margin: 0 0 12px;
}

/* 하단 결제 바 — 프라이머리 320×56, 그 아래 텍스트 버튼 320×36 */
.paybar {
  flex: none;
  background: #fff;
  padding: 16px 20px;
  border-top: 1px solid var(--line);
}

.btn-pay {
  width: 100%;
  height: 56px;
  border-radius: 10px;
  background: var(--blue);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.btn-pay:disabled {
  background: #c7cdd8;
}

.paybar__alt {
  display: block;
  width: 100%;
  height: 36px;
  text-align: center;
  color: var(--blue);
  font-size: 14px;
  font-weight: 600;
  margin-top: 4px;
}

/* ═══════════════ 시트 · 얼럿 ═══════════════ */

.dim {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 10;
}

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 11;
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 18px 16px 22px;
  animation: sheet-up 0.22s ease-out;
}

@keyframes sheet-up {
  from {
    transform: translateY(18px);
    opacity: 0.5;
  }
}

.sheet__x {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  font-size: 17px;
}

.sheet__title {
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 18px;
}

.sheet__amount-label {
  text-align: center;
  font-size: 13px;
  color: var(--ink-2);
  margin: 0;
}

.sheet__amount-label {
  line-height: 22px;
}

.sheet__amount {
  text-align: center;
  font-size: 29px;
  line-height: 38px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 24px;
}

.opt {
  width: 100%;
  height: 56px;
  border-radius: 10px;
  background: #eff3f9;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 16px;
}

.opt:last-of-type {
  margin-bottom: 0;
}

/* 카드 결제 시트 — Figma 882:82315.
 * 시트 236 / 제목 24부터 / 박스 320×86 / 카드 직접 입력 320×48 */
.sheet--method {
  padding: 36px 20px 40px;
}

.sheet--method .sheet__title {
  margin: 0 0 16px;
  line-height: 22px;
}

.sheet--method .sheet__x {
  top: 34px;
  right: 16px;
}

.sheet--card {
  padding: 24px 20px 16px;
}

.sheet--card .sheet__title {
  margin: 0 0 32px;
  line-height: 22px;
}

.sheet--card .sheet__x {
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
}

.opt--accent {
  width: 100%;
  height: 86px;
  border-radius: 10px;
  background: var(--blue-weak);
  color: var(--blue);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.opt--accent__row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 16px;
  line-height: 24px;
  font-weight: 700;
}

.opt__sub {
  font-size: 13px;
  line-height: 20px;
  font-weight: 500;
  color: var(--blue);
}

.opt-link {
  display: block;
  width: 100%;
  height: 48px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-3);
}

/* 얼럿 */

.alert {
  position: absolute;
  top: 50%;
  left: 24px;
  right: 24px;
  transform: translateY(-50%);
  z-index: 11;
  background: #fff;
  border-radius: 14px;
  padding: 20px 18px 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

.alert__x {
  position: absolute;
  top: 14px;
  right: 14px;
  color: var(--ink-3);
  font-size: 16px;
}

.alert__title {
  font-size: 16.5px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 0 0 8px;
  padding-right: 20px;
}

.alert__body {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0 0 18px;
}

.alert__btns {
  display: flex;
  gap: 8px;
}

.alert__btn {
  flex: 1;
  height: 44px;
  border-radius: 8px;
  font-size: 14.5px;
  font-weight: 700;
  background: var(--blue-weak);
  color: var(--blue);
}

.alert__btn--primary {
  background: var(--blue);
  color: #fff;
}

/* ═══════════════ 분할 결제 시트 ═══════════════ */

.split__total {
  text-align: center;
  font-size: 14.5px;
  font-weight: 700;
  margin: 0;
}

.split__remain {
  text-align: center;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--blue);
  margin: 0;
}

.split__clear {
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #c9ced8;
  color: #fff;
  font-size: 11px;
  font-style: normal;
  vertical-align: 4px;
  margin-left: 6px;
}

.split__hint {
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
  margin: 2px 0 14px;
}

.split__input {
  text-align: center;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 4px;
  color: var(--ink-3);
  min-height: 36px;
}

.split__input.is-filled {
  color: var(--ink);
}

.split__caret {
  display: inline-block;
  width: 2px;
  height: 24px;
  background: var(--blue);
  vertical-align: -3px;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  50% {
    opacity: 0;
  }
}

.split__err {
  text-align: center;
  font-size: 12px;
  color: #d84315;
  margin: 0 0 4px;
  min-height: 16px;
}

.split__pad {
  border-radius: 12px;
}

.quick {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 10px 0 12px;
}

.quick__btn {
  height: 32px;
  padding: 0 12px;
  border: 1px solid #d8dbe2;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 600;
  background: #fff;
}

.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-bottom: 14px;
}

.keypad__key {
  height: 46px;
  font-size: 20px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border-radius: 8px;
}

.split__btns {
  display: flex;
  gap: 8px;
}

.split__btn {
  flex: 1;
  height: 50px;
  border-radius: 10px;
  background: #f1f4f9;
  font-size: 15px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  color: var(--ink-3);
}

.split__btn.is-on {
  background: var(--blue-weak);
  color: var(--blue);
}

/* ═══════════════ 결제 진행중 ═══════════════ */

.progress {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(0, 0, 0, 0.45);
  display: grid;
  place-items: center;
}

/* Figma 882:82316 — 178×158, 스피너 40, 문구 상단에서 96 */
.progress__card {
  width: 178px;
  height: 158px;
  background: #fff;
  border-radius: 20px;
  position: relative;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.spinner {
  position: absolute;
  top: 40px;
  left: 50%;
  margin-left: -20px;
  width: 40px;
  height: 40px;
  border: 4px solid transparent;
  border-top-color: var(--blue);
  border-right-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.progress__label {
  position: absolute;
  top: 96px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 16px;
  line-height: 22px;
  font-weight: 700;
  margin: 0;
}

/* ═══════════════ 완료 화면 ═══════════════ */

.headsup {
  position: absolute;
  top: 30px;
  left: 10px;
  right: 10px;
  z-index: 12;
  background: #fff;
  border-radius: 14px;
  padding: 13px 15px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  animation: drop 0.25s ease-out;
}

@keyframes drop {
  from {
    transform: translateY(-12px);
    opacity: 0;
  }
}

.headsup__t {
  font-size: 13.5px;
  font-weight: 800;
  margin: 0 0 3px;
}

.headsup__b {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-2);
  margin: 0;
}

.done-sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 11;
  background: #fff;
  border-radius: 16px 16px 0 0;
  padding: 20px 16px 18px;
}

.done-sheet__kind {
  text-align: center;
  font-size: 13px;
  color: var(--ink-2);
  margin: 0;
}

.done-sheet__t {
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin: 3px 0 2px;
}

.done-sheet__amt {
  text-align: center;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 16px;
}

.mission {
  border-top: 1px solid var(--line);
  padding-top: 13px;
  margin-bottom: 16px;
}

.mission__h {
  font-size: 13px;
  font-weight: 700;
  margin: 0 0 8px;
}

.mission__row {
  display: flex;
  align-items: center;
  background: var(--blue-weak);
  border-radius: 8px;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 6px;
}

.mission__row span {
  margin-left: auto;
  font-weight: 600;
  color: var(--ink-3);
  font-size: 12px;
}

.wx {
  position: absolute;
  top: 88px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 16px;
  padding: 6px 13px;
  font-size: 12.5px;

 * 탭해야 하는 요소에는 id를 달아 두고, 단계 정의(steps.js)에서 그 id를 가리킵니다. */

const won = (n) => n.toLocaleString('ko-KR') + '원'

/* ── 공통 조각 ───────────────────────────────────────────── */

function statusbar(dark) {
  return `<div class="statusbar${dark ? ' statusbar--dark' : ''}">
    <span>12:00</span>
    <span class="statusbar__icons">▲ ▮ 76%</span>
  </div>`
}

function navbar(dark) {
  return `<div class="navbar${dark ? ' navbar--dark' : ''}"><span>|||</span><span>○</span><span>‹</span></div>`
}

 * 이 지도를 쓰는 화면은 상태바를 따로 그리지 않습니다.

/* ── 부릉플러스 · 배달지 상세 ─────────────────────────────── */

function detail(s) {
  const cash = s.order === 'cash'
  const remain = s.remain ?? s.total
  const partial = remain < s.total
  const kind = cash ? '현금' : '카드'
  const icon = cash ? ICON.cash : ICON.card

  /* 디자인(882:82730)에서는 바텀시트가 위까지 올라와 있어 지도는 28px만 보이고,
   * 지도 위 FAB(오더 받기·수행목록)은 시트에 가려집니다. */
  return `<div class="screen">
    ${mapBg()}
    <div class="detail">
      <div class="detail__grip"><span class="detail__handle"></span></div>
      <div class="detail__scroll">
        <div class="card">
          <p class="eyebrow">배달지로 이동해주세요</p>
          <h3 class="addr">강남대로 114길 10</h3>
          <p class="addr-sub"><span>강남대로 114길 10 부릉아파트 113동 1906호 (역삼동)</span><span class="copy">복사</span></p>
          <div class="btn-row">
            <span class="btn-line">${ICON.phone} 고객 전화</span>
            <span class="btn-line">${ICON.navi} 길 찾기</span>
          </div>
        </div>
        <div class="card">
          <p class="label">배송메시지</p>
          <p class="value">벨 누르지 말고 문 앞에 두고 노크해주세요</p>
          <span class="btn-line btn-line--sm">${ICON.sms} 문자 전송</span>
        </div>
        <div class="card">
          <p class="label">상품픽업번호</p>
          <p class="value value--lg">F2512011457J8ME2</p>
          <p class="value value--plain">부릉치킨 선릉점</p>
          <div class="amount-row">
            <span class="amount-row__label">결제필요금액</span>
            <span class="amount-row__value">${won(s.total)}</span>
            <span class="badge badge--${cash ? 'cash' : 'card'}">${cash ? '후불현금' : '후불카드'}</span>
          </div>
        </div>
        <div class="card">
          <p class="label">부릉오더번호 (VCC 소통용)</p>
          <p class="value value--lg">20249230141#1212</p>
          <span class="btn-line btn-line--sm">${ICON.vcc} VCC 연결</span>
        </div>
      </div>
      <div class="paybar">
        ${partial ? `<p class="warn-row">${ICON.warn} 잔여 결제 금액 있음</p>` : ''}
        <button class="btn-pay" id="cta">${
          partial ? `${won(remain)} 결제하기` : `${icon} ${kind} ${won(remain)} 결제하기`
        }</button>
        ${partial ? '' : '<button class="paybar__alt" id="alt">다른 방법으로 결제</button>'}
      </div>
    </div>
    ${s.toast ? `<div class="toast">${s.toast}</div>` : ''}
  </div>`
}

      <button class="opt" id="m-card">${ICON.card} 카드</button>

/* ── 카드 결제 시트 ──────────────────────────────────────── */

function cardSheet(s) {

/* ── 분할 결제 시트 ──────────────────────────────────────── */

function splitSheet(s) {
  const typed = s.typed || 0
  const remain = s.remain ?? s.total
  const over = typed > remain
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', '←']
  /* 2회차부터는 남은 금액이 미리 채워져 나오고, 빠른 금액 버튼이 없습니다 (882:82614). */
  const round2 = remain < s.total

  const head = round2
    ? `<p class="split__remain">남은금액 ${won(remain)}</p>
       <p class="split__hint">총 ${won(s.total)}</p>`
    : `<p class="split__total">총 ${won(remain)} 중</p>
       <p class="split__hint">(컵 보증금 900원 포함)</p>`

  const input = typed
    ? `${won(typed)}${round2 ? '<i class="split__clear">✕</i>' : ''}`
    : '<i class="split__caret"></i>얼마를 결제할까요?'

  const pad = `<div class="split__pad">
      ${
        round2
          ? ''
          : `<div class="quick">
        <button class="quick__btn" id="q-1000">+1천원</button>
        <button class="quick__btn" id="q-5000">+5천원</button>
        <button class="quick__btn" id="q-10000">+1만원</button>
      </div>`
      }
      <div class="keypad">
        ${keys.map((k) => `<button class="keypad__key" id="k-${k === '←' ? 'back' : k}">${k}</button>`).join('')}
      </div>
    </div>`

  return `${detail(s)}
    <div class="dim"></div>
    <div class="sheet">
      <span class="sheet__x">✕</span>
      <h4 class="sheet__title">분할 결제</h4>
      ${head}
      <p class="split__input${typed ? ' is-filled' : ''}">${input}</p>
      <p class="split__err">${over ? '남은 금액보다 작게 입력하세요' : ''}</p>
      ${pad}
      <div class="split__btns">
        <button class="split__btn${typed && !over ? ' is-on' : ''}" id="s-cash">${ICON.cash} 현금</button>
        <button class="split__btn${typed && !over ? ' is-on' : ''}" id="s-card">${ICON.card} 카드</button>
      </div>
    </div>`
}

/* ── 결제 진행중 ─────────────────────────────────────────── */

function progress(s = {}) {
  /* 로딩은 덮개일 뿐입니다. under에 화면 이름을 주면 직전에 보던 화면을 그대로
   * 뒤에 깔아, 기다리는 동안 화면이 꺼진 것처럼 보이지 않게 합니다. */
  return `<div class="screen">
    ${s.under ? SCREENS[s.under](s) : mapBg()}
    <div class="progress"><div class="progress__card">
      <div class="spinner"></div>
      <p class="progress__label">${s.label || '결제 진행중'}</p>
    </div></div>
  </div>`
}

function kispayLoading() {
  return `<div class="kis">

/* 연습 진행 엔진 — 시작 화면 → 단계 → 마무리 화면 */

const app = {
  view: 'cover', // cover(표지) | ready(시작 확인) | step | outro
  track: null,
  index: 0,
  typed: 0,
  cleared: new Set(),
  greeted: false, // 시작 안내 모달은 한 번만 봅니다
}

const $ = (sel, root = document) => root.querySelector(sel)
const frame = () => $('#frame')

/* ── 화면 크기 맞추기 ────────────────────────────────────── */

function fit() {
  const w = window.innerWidth
  const h = window.innerHeight
  const phone = w <= 520
  /* 폰에서는 CSS가 화면을 꽉 채우므로 축소하지 않습니다. */
  if (phone) {
    document.documentElement.style.setProperty('--scale', '1')
    return
  }
  // 컨트롤이 프레임 안으로 들어와서 위아래 여백만 빼면 됩니다.
  /* 테두리 8px이 양쪽에 붙으므로 바깥 크기는 376×796입니다. */
  const scale = Math.min((w - 64) / 376, (h - 56) / 796, 1)
  document.documentElement.style.setProperty('--scale', String(Math.max(scale, 0.42)))
}

/* ── 표지 ──────────────────────────────────────────────────
 * 쿠팡이츠·배민 «연습하기»처럼 표지에서 무엇을 연습할지 먼저 고릅니다. */

function renderCover() {
  frame().innerHTML = `<div class="cover">
    <span class="cover__tag">부릉플러스 기사앱</span>
    <p class="cover__hi">만나서 반가워요!</p>
    <h1 class="cover__title">함께 후불결제<br>연습해볼까요?</h1>
    ${ICON.cover}
    <div class="cover__opts">
      ${TRACKS.map((t, i) => {
        const done = app.cleared.has(t.id)
        return `<button class="cover__opt${done ? ' is-done' : ''}" data-track="${i}">
          <span>${t.title} 연습하기</span>
          ${done ? '<i class="cover__check">✓</i>' : ICON.chev}
        </button>`
      }).join('')}
    </div>
    <p class="cover__foot">연습용 화면이라 실제 결제는 일어나지 않아요</p>
    <a class="cover__switch" href="../postpaid-ios/">아이폰이신가요?</a>
  </div>`

  frame()
    .querySelectorAll('[data-track]')
    .forEach((el) =>
      el.addEventListener('click', () => {
        app.track = TRACKS[+el.dataset.track]
        app.index = 0
        app.typed = 0
        app.view = startView()
        render()
      }),
    )
}

/** 연습을 시작할 때 볼 화면. 안내를 이미 봤으면 곧장 첫 단계로 들어갑니다. */
function startView() {
  return app.greeted ? 'step' : 'ready'
}

/* ── 시작 확인 ─────────────────────────────────────────────
 * 첫 화면 위에 모달을 띄워 «따라 눌러주세요»를 알려주고 시작합니다. */

function renderReady() {
  const first = app.track.steps[0]
  frame().innerHTML = `
    ${topbar()}
    ${band({ q: `${app.track.title} 연습`, a: '준비되면 <b>시작</b>해주세요' })}
    <div class="viewport" id="vp">
      ${SCREENS[first.screen]({ ...first.state })}
      <div class="dim"></div>
      <div class="start">
        ${ICON.start}
        <h2 class="start__title">같이 연습해볼까요?</h2>
        <p class="start__desc">위에 나오는 설명을 보고<br>그대로 따라 눌러주세요</p>
        <p class="start__notice">연습용 화면이라 <b>실제로 돈이 결제되지 않아요</b></p>
        <button class="start__go" id="go">네, 시작할게요</button>
      </div>
    </div>`

  $('#go').addEventListener('click', () => {
    app.greeted = true
    app.view = 'step'
    render()
  })
}

/** 화면 위 안내 띠 */
/**
 * 그 화면이 어느 앱인지 — 화면 이름으로 알아냅니다.
 * 결제 한 건에 앱이 두세 번 바뀌는데, 기사님은 바뀐 줄 모르고 헤맵니다.
 * 바뀌는 단계에서만 화면이 올라오는 효과를 줘서 «다른 앱이구나»를 알립니다.
 */
function appOf(screen) {
  if (/^kis/.test(screen)) return 'kispay'
  if (/^(easycheck|ec|kicc)/.test(screen)) return 'easycheck'
  return 'vroong'
}

function band({ q, a, note, now, total }) {
  const pct = total ? Math.round(((now + 1) / total) * 100) : 0
  return `<div class="band" id="band">
    <div class="band__bar"><i style="width:${pct}%"></i></div>
    <p class="band__q">${q}</p>
    ${total ? `<span class="band__count">${now + 1} / ${total}</span>` : ''}
    <p class="band__a">${a}</p>
    ${note ? `<p class="band__note">${note}</p>` : ''}
  </div>`
}

/* ── 마무리 화면 ─────────────────────────────────────────── */

function renderOutro() {
  const t = app.track
  const next = TRACKS[TRACKS.indexOf(t) + 1]
  /* 결과는 카드 하나로 묶습니다. 흰 덩어리가 둘이면 어느 쪽을 봐야 할지 흩어집니다. */
  frame().innerHTML = `${topbar()}<div class="outro">
    <div class="outro__card">
      ${ICON.check}
      <h2 class="outro__title">${t.title}<br>연습을 마쳤어요</h2>
      <p class="outro__sub">이대로 하시면 돼요</p>
      <div class="recap">
        <p class="recap__h">기억할 것</p>
        ${t.recap.map((r) => `<p class="recap__li">${r}</p>`).join('')}
      </div>
      ${t.apps ? appLinks(t.apps) : ''}
    </div>
    <button class="outro__btn" id="o-next">${next ? `다음 연습 · ${next.title}` : '처음 화면으로'}</button>
    <div class="outro__links">
      <button class="outro__link" id="o-again">이 연습 다시 하기</button>
      ${next ? '<button class="outro__link" id="o-home">처음 화면으로</button>' : ''}
    </div>
  </div>`

  $('#o-next').addEventListener('click', () => {
    if (next) {
      app.track = next
      app.index = 0
      app.typed = 0
      app.view = startView()
    } else {
      app.view = 'cover'
    }
    render()
  })
  $('#o-again').addEventListener('click', () => {
    app.index = 0
    app.typed = 0
    app.view = 'step'
    render()
  })
  /* 마지막 갈래에서는 위 큰 버튼이 이미 «처음 화면으로»라 따로 두지 않습니다. */
  $('#o-home')?.addEventListener('click', () => {
    app.view = 'cover'
    render()
  })
}

/** 마무리 카드 아래 붙는 앱 설치 버튼. 스토어는 새 창에서 엽니다. */
function appLinks(apps) {
  return `<div class="stores">
    <p class="stores__h">앱이 없으면 먼저 설치해주세요</p>
    ${apps
      .map(
        (a) => `<a class="store" href="${a.url}" target="_blank" rel="noopener">
      ${ICON.download}<span>${a.name} 설치</span>
    </a>`,
      )
      .join('')}
  </div>`
}

/* ── 단계 화면 ───────────────────────────────────────────── */

let autoTimer = null

function currentStep() {
  return app.track.steps[app.index]
}

function renderStep() {
  const step = currentStep()
  const state = { ...step.state }
  if (step.type) state.typed = app.typed

  /* 앞 단계와 앱이 다르면 «다른 앱이 열린다»는 걸 몸으로 알 수 있게 화면을 올려 보냅니다. */
  const prev = app.track.steps[app.index - 1]
  const switched = prev && appOf(prev.screen) !== appOf(step.screen)

  frame().innerHTML = `
    ${topbar()}
    ${band({ ...step, now: app.index, total: app.track.steps.length })}
    <div class="viewport${switched ? ' is-switching' : ''}" id="vp">
      ${SCREENS[step.screen](state)}
      ${step.scene ? scene(step.scene) : ''}
    </div>`

  clearTimeout(autoTimer)
  if (step.auto) {
    autoTimer = setTimeout(next, step.auto)
    return
  }
  /* 시트·얼럿이 올라오는 동안 위치를 재면 강조 링이 어긋나므로, 끝나기를 기다립니다.
   * 스피너처럼 끝나지 않는 애니메이션은 빼고 봅니다.
   * 글꼴도 기다립니다 — 늦게 오면 글자가 다시 흘러 버튼이 밀리는데, 그 전에 재면
   * 링이 엉뚱한 곳에 붙습니다. */
  const vp = $('#vp')
  const settling = vp
    .getAnimations({ subtree: true })
    .filter((a) => a.effect?.getTiming().iterations !== Infinity)
    .map((a) => a.finished.catch(() => {}))
  if (document.fonts?.status !== 'loaded') settling.push(document.fonts.ready.catch(() => {}))
  if (settling.length) Promise.all(settling).then(() => app.view === 'step' && placeSpot())
  else placeSpot()
  vp.addEventListener('click', onTap, true)
}

/**
 * 고객이 무엇을 내밀며 뭐라고 하는지 — 첫 단계에서 상황을 먼저 보여줍니다.
 * 어두워진 자리 위에 뜨고, 탭은 막지 않아 아래 버튼을 그대로 누를 수 있습니다.
 */
function scene({ held, say }) {
  return `<div class="scene"><div class="scene__in">
    <p class="scene__say">${say}</p>
    ${customerArt(held)}
  </div></div>`
}

/** 눌러야 할 곳에 파란 테두리와 손 모양을 올려둡니다. */
function placeSpot() {
  const step = currentStep()
  const vp = $('#vp')
  const el = vp.querySelector(step.target)
  if (!el) return

  vp.querySelectorAll('.spot, .hand, .tip').forEach((n) => n.remove())

  /* 화면이 낮으면 눌러야 할 곳이 접혀 있을 수 있습니다. 먼저 보이는 자리로 끌어옵니다. */
  el.scrollIntoView({ block: 'nearest', inline: 'nearest' })

  const box = el.getBoundingClientRect()
  const base = vp.getBoundingClientRect()
  const scale = box.width / el.offsetWidth || 1
  /* .spot은 vp 안에 absolute로 놓이므로, 스크롤한 만큼을 더해야 제자리에 붙습니다. */
  const x = (box.left - base.left) / scale + vp.scrollLeft
  const y = (box.top - base.top) / scale + vp.scrollTop
  const w = box.width / scale
  const h = box.height / scale

  const vw = base.width / scale
  const vh = base.height / scale

  vp.insertAdjacentHTML(
    'beforeend',
    `<div class="spot" style="left:${x - 3}px;top:${y - 3}px;width:${w + 6}px;height:${h + 6}px"></div>`,
  )

  /* 고객 그림은 어둠이 깔린 뒤에 떠오릅니다. 같이 나타나면 무엇이 바뀐 건지
   * 눈이 못 따라갑니다. */
  vp.querySelector('.scene')?.classList.add('is-in')

  /* 누르지 않고 설명만 하는 단계는 손 대신 말풍선을 띄우고 `다음`으로 넘어갑니다. */
  if (step.tip) {
    placeTip(vp, step.tip, { x, y, w, h, vw, vh })
    $('#tip-next').addEventListener('click', next)
    return
  }

  /* 누를 자리는 손 모양으로 알려줍니다 (배민 `연습하기`와 같은 방식).
   * 화면 밖으로 나가면 잘리므로 안쪽으로 당겨 둡니다. */
  const HAND = 46
  const hx = Math.min(x + w - 30, vw - HAND - 10)
  const hy = Math.min(y + h - 16, vh - HAND - 10)

  vp.insertAdjacentHTML(
    'beforeend',
    ICON.hand.replace('class="hand"', `class="hand" style="left:${hx}px;top:${hy}px"`),
  )
}

/** 강조한 자리를 가리키는 말풍선. 자리가 없으면 아래에 붙습니다. */
function placeTip(vp, tip, { x, y, w, h, vw, vh }) {
  const GAP = 14
  const width = Math.min(268, vw - 32)
  const above = y > 170

  const left = Math.min(Math.max(x + w / 2 - width / 2, 12), vw - width - 12)
  const pos = above ? `bottom:${vh - y + GAP}px` : `top:${y + h + GAP}px`
  // 삼각형은 강조한 자리의 가운데를 가리킵니다.
  const arrow = Math.min(Math.max(x + w / 2 - left - 8, 14), width - 30)

  vp.insertAdjacentHTML(
    'beforeend',
    `<div class="tip tip--${above ? 'above' : 'below'}" style="left:${left}px;width:${width}px;${pos}">
      <div class="tip__body">
        <p class="tip__title">${tip.title}</p>
        <p class="tip__desc">${tip.desc}</p>
      </div>
      <button class="tip__next" id="tip-next">다음</button>
      <span class="tip__arrow" style="left:${arrow}px"></span>
    </div>`,
  )
}

/* ── 탭 처리 ─────────────────────────────────────────────── */

function onTap(e) {
  const step = currentStep()
  const vp = $('#vp')

  if (step.type) {
    const key = e.target.closest('.keypad__key, .quick__btn')
    if (key) {
      e.stopPropagation()
      applyKey(key.id, step)
      return
    }
  }

  if (!step.tip && e.target.closest(step.target)) {
    e.stopPropagation()
    next()
    return
  }
  if (step.tip && e.target.closest('#tip-next')) return

  // 다른 곳을 누르면 넘어가지 않고 안내만 한 번 흔들어 줍니다.
  e.stopPropagation()
  const band = $('#band')
  band.classList.remove('is-nudge')
  void band.offsetWidth
  band.classList.add('is-nudge')
}

function applyKey(id, step) {
  const remain = step.state.remain ?? step.state.total
  if (id.startsWith('q-')) {
    app.typed = Math.min(app.typed + +id.slice(2), remain)
  } else if (id === 'k-back') {
    app.typed = Math.floor(app.typed / 10)
  } else {
    const digits = id.slice(2)
    const nextVal = +(String(app.typed) + digits)
    if (nextVal <= 99999999) app.typed = nextVal
  }

  if (app.typed === step.type.expect) {
    next()
    return
  }
  /* 화면을 통째로 다시 그리면 시트가 다시 올라오면서 깜빡이므로 입력한 곳만 고칩니다. */
  refreshSplit(step)
}

/** 분할 시트에서 금액 표시와 결제 버튼 상태만 갱신합니다. */
function refreshSplit(step) {
  const vp = $('#vp')
  const typed = app.typed
  const remain = step.state.remain ?? step.state.total
  const over = typed > remain

  const input = vp.querySelector('.split__input')
  if (!input) return
  input.classList.toggle('is-filled', typed > 0)
  input.innerHTML = typed ? won(typed) : '<i class="split__caret"></i>얼마를 결제할까요?'

  const err = vp.querySelector('.split__err')
  if (err) err.textContent = over ? '남은 금액보다 작게 입력하세요' : ''

  vp.querySelectorAll('.split__btn').forEach((b) => b.classList.toggle('is-on', typed > 0 && !over))
}

function next() {
  app.index += 1
  app.typed = 0
  if (app.index >= app.track.steps.length) {
    app.cleared.add(app.track.id)
    app.view = 'outro'
  }
  render()
}

function back_() {
  if (app.view === 'outro') {
    app.view = 'step'
    app.index = app.track.steps.length - 1
  } else if (app.index > 0) {
    app.index -= 1
  } else {
    app.view = 'cover'
  }
  app.typed = 0
  render()
}

/* ── 프레임 안 맨 위 컨트롤 ───────────────────────────────
 * 기사님이 폰으로 보기 때문에 프레임 밖에 두면 누르기 어렵습니다. */

function topbar() {
  return `<div class="topbar">
    <button class="topbar__btn" id="c-back">← 이전으로</button>
    <button class="topbar__btn" id="c-home">⌂ 처음으로</button>
  </div>`
}

/** topbar()를 넣은 화면에서 불러 버튼을 살립니다. */
function bindTopbar() {
  const back = $('#c-back')
  if (!back) return
  back.addEventListener('click', back_)
  $('#c-home').addEventListener('click', () => {
    clearTimeout(autoTimer)
    app.view = 'cover'
    app.typed = 0
    render()
  })
}

/* ── 그리기 ──────────────────────────────────────────────── */

function render() {
  clearTimeout(autoTimer)
  if (app.view === 'cover') renderCover()
  else if (app.view === 'ready') renderReady()
  else if (app.view === 'outro') renderOutro()
  else renderStep()
  bindTopbar()
}

/* 창 크기가 바뀌면 글자가 다시 흘러 버튼이 움직이므로 링도 다시 잡습니다. */
window.addEventListener('resize', () => {
  fit()
  if (app.view === 'step' && !currentStep().auto) placeSpot()
})

window.addEventListener('orientationchange', fit)
fit()
render()

    </script>
  </body>
</html>
